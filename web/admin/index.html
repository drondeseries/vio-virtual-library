<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Release Desk · Vio Virtual Library</title>
<style>
__INLINE_CSS__
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></symbol>
    <symbol id="i-film" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 4v16M16 4v16M3 9h18M3 15h18"/></symbol>
    <symbol id="i-tv" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="m8 21 4-3 4 3"/></symbol>
    <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11A8 8 0 1 0 18.7 16M20 4v7h-7"/></symbol>
    <symbol id="i-dot" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/></symbol>
    <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5 5h14l3 7v7H2v-7l3-7z"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 2 21h20L12 3z"/><path d="M12 10v5M12 18v.5"/></symbol>
  </defs>
</svg>

<div class="shell">
  <header class="topbar">
    <div class="brand">
      <span class="eyebrow">Vio · Virtual Library</span>
      <h1>Release Desk</h1>
    </div>
    <div class="topbar-actions">
      <span class="live-stamp" id="live-stamp" title="Data last loaded"><span class="dot"></span> Loading…</span>
      <button class="btn primary" id="btn-refresh-schedules" type="button" aria-label="Refresh TVmaze release schedules for tracked shows">
        <svg class="ic" aria-hidden="true"><use href="#i-refresh"/></svg><span>Refresh schedules</span>
      </button>
      <a class="btn ghost" id="btn-back" href="/admin/plugins">&#8592; Admin</a>
    </div>
  </header>

  <section class="kpis" aria-label="Overview">
    <div class="kpi"><div class="kpi-ic gold"><svg aria-hidden="true"><use href="#i-film"/></svg></div>
      <div><strong id="kpi-monitored">—</strong><span>Monitored items</span></div></div>
    <div class="kpi"><div class="kpi-ic warn"><svg aria-hidden="true"><use href="#i-cal"/></svg></div>
      <div><strong id="kpi-waiting">—</strong><span>Awaiting release</span></div></div>
    <div class="kpi"><div class="kpi-ic teal"><svg aria-hidden="true"><use href="#i-bolt"/></svg></div>
      <div><strong id="kpi-forced">—</strong><span>Force-added</span></div></div>
    <div class="kpi"><div class="kpi-ic ok"><svg aria-hidden="true"><use href="#i-tv"/></svg></div>
      <div><strong id="kpi-shows">—</strong><span>Tracked shows</span></div></div>
  </section>

  <nav class="tabs" role="tablist" aria-label="Sections">
    <button class="tab is-active" id="tab-queue"   role="tab" aria-selected="true"  aria-controls="view-queue"   data-view="queue">Queue <span class="badge" id="badge-queue">·</span></button>
    <button class="tab"           id="tab-schedule" role="tab" aria-selected="false" aria-controls="view-schedule" data-view="schedule">Schedule <span class="badge" id="badge-schedule">·</span></button>
    <button class="tab"           id="tab-calendar" role="tab" aria-selected="false" aria-controls="view-calendar" data-view="calendar">Calendar <span class="badge" id="badge-calendar">·</span></button>
  </nav>

  <!-- QUEUE -->
  <section class="view" id="view-queue" role="tabpanel" aria-labelledby="tab-queue">
    <div class="toolbar">
      <label class="search">
        <svg class="ic" aria-hidden="true"><use href="#i-search"/></svg>
        <input id="q-search" type="search" placeholder="Search titles, IMDb IDs…" aria-label="Search monitored media">
      </label>
      <div class="chips" role="group" aria-label="Filter by type">
        <button class="chip is-active" type="button" data-filter="all">All</button>
        <button class="chip" type="button" data-filter="movie">Movies</button>
        <button class="chip" type="button" data-filter="series">Series</button>
        <button class="chip" type="button" data-filter="forced">Force-added</button>
      </div>
      <label class="sort">
        <span class="sr-only">Sort</span>
        <select id="q-sort" aria-label="Sort queue">
          <option value="title-asc">Title A–Z</option>
          <option value="title-desc">Title Z–A</option>
          <option value="year-desc">Year, newest</option>
          <option value="release-asc">Release, soonest</option>
        </select>
      </label>
    </div>
    <div id="queue-status" class="section-msg" hidden></div>
    <ul class="rows" id="queue-list" aria-live="polite"></ul>
  </section>

  <!-- SCHEDULE -->
  <section class="view" id="view-schedule" role="tabpanel" aria-labelledby="tab-schedule" hidden>
    <p class="view-hint">Upcoming air dates tracked from TVmaze. Titles register automatically once episodes air.</p>
    <div id="schedule-status" class="section-msg" hidden></div>
    <div id="schedule-groups"></div>
  </section>

  <!-- CALENDAR -->
  <section class="view" id="view-calendar" role="tabpanel" aria-labelledby="tab-calendar" hidden>
    <p class="view-hint">Monitored titles with known home-media dates.</p>
    <div id="calendar-status" class="section-msg" hidden></div>
    <ul class="cal-list" id="calendar-list"></ul>
  </section>
</div>

<!-- confirm modal -->
<div class="modal-root" id="modal-root" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h2 id="modal-title"></h2>
    <p id="modal-body"></p>
    <div class="modal-actions">
      <button class="btn ghost" type="button" id="modal-cancel">Cancel</button>
      <button class="btn danger" type="button" id="modal-confirm">Remove</button>
    </div>
  </div>
</div>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<template id="tpl-queue-row">
  <li class="row">
    <div class="poster" data-role="poster" aria-hidden="true"></div>
    <div class="row-main">
      <div class="row-title"><span data-role="title"></span> <span class="dim" data-role="year"></span></div>
      <div class="row-meta">
        <span class="pill" data-role="type"></span>
        <span class="pill subtle" data-role="state"></span>
        <span class="pill subtle" data-role="missing" hidden></span>
      </div>
      <div class="row-sub dim" data-role="missing-list" hidden></div>
    </div>
    <div class="row-side">
      <span class="when" data-role="when"></span>
      <div class="row-actions">
        <button class="btn small primary" type="button" data-action="search" data-key data-role="act-search">Request release</button>
        <button class="btn small" type="button" data-action="force" data-key aria-label="Force add"><svg class="ic" aria-hidden="true"><use href="#i-bolt"/></svg>Force</button>
        <button class="btn small icon danger-hover" type="button" data-action="remove" data-key aria-label="Remove from monitor queue"><svg class="ic" aria-hidden="true"><use href="#i-trash"/></svg></button>
      </div>
    </div>
  </li>
</template>

<template id="tpl-schedule-card">
  <article class="sched-card">
    <div class="poster sm" data-role="poster" aria-hidden="true"></div>
    <div class="sched-main">
      <div class="row-title"><span data-role="title"></span> <span class="dim mono" data-role="imdb"></span></div>
      <div class="row-meta"><span class="pill" data-role="status"></span><span class="pill accent" data-role="next"></span></div>
      <ol class="ep-list" data-role="eps"></ol>
    </div>
  </article>
</template>

<template id="tpl-calendar-card">
  <li class="cal-card">
    <div class="cal-date"><strong data-role="day"></strong><span data-role="month"></span></div>
    <div class="cal-main">
      <div class="row-title" data-role="title"></div>
      <div class="dim" data-role="sub"></div>
    </div>
    <span class="pill" data-role="type"></span>
  </li>
</template>

<script>__INLINE_JS__</script>
</body>
</html>
